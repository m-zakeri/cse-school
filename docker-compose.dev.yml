services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    container_name: ce-school-frontend-dev
    stdin_open: true
    tty: true

  backend-dev:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Optional in development: when unset the backend generates a throwaway key
      # at startup. Set it to keep tokens valid across restarts.
      - SECRET_KEY=${SECRET_KEY:-}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres-dev:5432/ce_school_db
      - REDIS_URL=redis://redis-dev:6379/0
      - ENVIRONMENT=development
      - RELOAD=true
      - S3_ENDPOINT_INTERNAL=http://minio-dev:9000
      - S3_ENDPOINT_PUBLIC=http://localhost:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=course-videos
    restart: unless-stopped
    container_name: ce-school-backend-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_started
      minio-dev:
        condition: service_started

  postgres-dev:
    image: postgres:16-alpine
    container_name: ce-school-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ce_school_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-dev:
    image: redis:7-alpine
    container_name: ce-school-redis-dev
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_dev_data:/data

  minio-dev:
    image: quay.io/minio/minio:latest
    container_name: ce-school-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_dev_data:/data

volumes:
  postgres_dev_data:
  redis_dev_data:
  minio_dev_data:

