# Fixed project name: volumes keep the same names (ce_school_*) wherever the
# repository is checked out, so a redeploy or a new clone never loses data.
name: ce_school

# Keep container logs from filling the disk on a long-running server.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    image: ce-school/frontend:latest
    logging: *default-logging
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the browser bundle at build time, so it must be the URL
        # the *browser* uses to reach the API.
        NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    restart: unless-stopped
    container_name: ce-school-frontend
    depends_on:
      backend:
        condition: service_healthy

  backend:
    image: ce-school/backend:latest
    logging: *default-logging
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${BIND_ADDR:-0.0.0.0}:8000:8000"
    environment:
      # `:?` makes compose refuse to start when the value is missing, so a
      # production stack can never silently fall back to a shared key.
      # See .env.example for how to generate each value.
      - "SECRET_KEY=${SECRET_KEY:?missing SECRET_KEY, see .env.example}"
      - "FIRST_SUPERUSER_PASSWORD=${FIRST_SUPERUSER_PASSWORD:?missing FIRST_SUPERUSER_PASSWORD, see .env.example}"
      - "FIRST_SUPERUSER_EMAIL=${FIRST_SUPERUSER_EMAIL:-admin@aut.ac.ir}"
      - "DATABASE_URL=postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD, see .env.example}@postgres:5432/ce_school_db"
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      # Object storage for course videos. S3_ENDPOINT_PUBLIC is the host the
      # browser will hit, so in a real deployment set S3_PUBLIC_ENDPOINT to a
      # publicly reachable URL (e.g. https://media.your-domain.ir).
      - S3_ENDPOINT_INTERNAL=http://minio:9000
      - "S3_ENDPOINT_PUBLIC=${S3_PUBLIC_ENDPOINT:-http://localhost:9000}"
      - "S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}"
      - "S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:?missing MINIO_ROOT_PASSWORD, see .env.example}"
      - S3_BUCKET=course-videos
      - "EXTRA_CORS_ORIGINS=${EXTRA_CORS_ORIGINS:-}"
    restart: unless-stopped
    container_name: ce-school-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  # The only thing a visitor talks to on a server: everything is served from one
  # address on one port (HTTP_PORT, 80 in production) and nginx routes it. Set
  # BIND_ADDR=127.0.0.1 in .env so the app ports (3000/8000/9000) are not reachable
  # from outside. Locally HTTP_PORT defaults to 8080 so it never fights for port 80.
  nginx:
    image: nginx:1.27-alpine
    logging: *default-logging
    container_name: ce-school-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres:
    image: postgres:16-alpine
    logging: *default-logging
    container_name: ce-school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?missing POSTGRES_PASSWORD, see .env.example}"
      POSTGRES_DB: ce_school_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    logging: *default-logging
    container_name: ce-school-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data

  minio:
    # quay.io/minio/minio and Docker Hub's minio/minio are no longer published, so
    # use the maintained Chainguard build (same MinIO server, S3 API unchanged).
    image: cgr.dev/chainguard/minio:latest
    # The data volume may already hold root-owned files from an earlier image.
    user: "0:0"
    logging: *default-logging
    container_name: ce-school-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?missing MINIO_ROOT_PASSWORD, see .env.example}"
    ports:
      - "${BIND_ADDR:-0.0.0.0}:9000:9000"
      # Admin console: local only. Reach it through an SSH tunnel if needed.
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  redis_data:
  minio_data:

