# Reverse proxy: the whole site on one address and the default HTTP port (80).
#
#   /                  -> frontend (Next.js, production build)
#   /api/              -> backend (FastAPI); the interactive docs are NOT published
#   /course-videos/... -> MinIO (signed, time-limited video URLs; read-only)
#
# Containers are resolved at request time (Docker's DNS, 127.0.0.11) so a
# redeployed backend or frontend with a new IP never leaves nginx pointing at a
# dead address.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend http://frontend:3000;
    set $backend  http://backend:8000;
    set $media    http://minio:9000;

    # Lecture uploads go through /api/ (the video limit itself is enforced by the API).
    client_max_body_size 2200m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # Host must stay exactly what the browser used: MinIO's signed URLs are bound to it.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite (never append) so a client cannot fake its address for the login rate limit.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend;
        # Stream big uploads straight to the API instead of spooling them to disk first.
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # The API documentation (Swagger UI, ReDoc, the OpenAPI schema) is not for visitors.
    # Developers reach it on the server itself: ssh -L 8000:127.0.0.1:8000 user@server,
    # then http://localhost:8000/docs
    location ~ ^/(docs|redoc)(/|$) {
        return 404;
    }
    location = /api/v1/openapi.json {
        return 404;
    }

    location = /health {
        proxy_pass $backend;
    }

    # Video bytes. Only reads are allowed; uploads always go through the API.
    location /course-videos/ {
        limit_except GET HEAD {
            deny all;
        }
        proxy_pass $media;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass $frontend;
    }
}
